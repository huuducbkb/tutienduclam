<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HỒNG ĐỨC TU TIÊN LỘ v2.8.7.5 — TIME SKIP ĐA HOẠT ĐỘNG</title>
<style>body{background:#0b0e14;color:#c9d1d9;font-family:sans-serif;padding:20px}</style>
</head>
<body>
<h1>HỒNG ĐỨC TU TIÊN LỘ v2.8.7.5</h1>
<script>
'use strict';
const APP_VERSION='2.8.7.5';
const DB_VERSION=1;
const NO_PRECEDENT='❌ Bạn chưa thiết lập việc này trong game - hãy thực hiện hành động đó trước khi bỏ qua thời gian.';
const QUALITY_WORDS=['hạ','trung','thượng','cực','tuyệt','tiên','linh','thần'];
const UNIT_WORDS=['viên','cái','quả','hoàn','lạng','khối','phần','lọ','bình','đoạn','mảnh','cây','gốc'];
function normalizeName(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[đĐ]/g,'d').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ')}
function bareItemName(s){return String(s||'').replace(/\s*\[[^\]]+\]\s*$/,'').trim()}
function itemQuality(s){const m=String(s||'').match(/\[([^\]]+)\]/);return m?normalizeName(m[1]):''}
function itemKey(item){const name=typeof item==='string'?item:item?.name||'';return normalizeName(bareItemName(name))+'|'+itemQuality(name)+'|'+(item?.danVan?'1':'0')}
function mergeItemStack(list,item){const key=itemKey(item);const found=list.find(x=>itemKey(x)===key);if(found)found.quantity=(found.quantity||0)+(item.quantity||0);else list.push({...item});return list}
function findAllMatchingItems(inventory, candidate){const c=normalizeName(candidate);return (inventory||[]).filter(item=>{const n=typeof item==='string'?item:item.name;return [n,bareItemName(n)].some(v=>normalizeName(v)===c||normalizeName(v).includes(c)||c.includes(normalizeName(v)))})}
function findMatchingInventoryItem(inventory,candidate,quality){const matches=findAllMatchingItems(inventory,candidate);const q=quality?normalizeName(quality):'';return matches.filter(i=>!q||itemQuality(i.name||i)===q).sort((a,b)=>(a.quantity||0)-(b.quantity||0))[0]||matches.sort((a,b)=>(a.quantity||0)-(b.quantity||0))[0]||null}
function extractItemCandidate(command,inventory=[]){const words=String(command||'').split(/\s+/).filter(Boolean);let best=null;for(let i=0;i<words.length;i++)for(let j=words.length;j>i;j--){const seq=words.slice(i,j).join(' ');const hit=findAllMatchingItems(inventory,seq);if(hit.length&&( !best||seq.length>best.text.length))best={text:seq,items:hit}}
if(best)return best.text;const filtered=words.filter(w=>!/^\d+(?:[.,]\d+)?$/.test(w)&&!UNIT_WORDS.includes(normalizeName(w)));return filtered.join(' ')}
function extractQuality(command){const n=normalizeName(command);return QUALITY_WORDS.find(q=>new RegExp('\\b'+q+'(?:\\s+pham)?\\b').test(n))||null}
function resolveGiveTarget(command,inventory){const quality=extractQuality(command);const candidate=extractItemCandidate(command,inventory);return findMatchingInventoryItem(inventory,candidate,quality)}
function validateGive(command,inventory){const target=resolveGiveTarget(command,inventory);if(!target)return {ok:false,message:'🚫 Không thể cho/tặng vật phẩm mà bạn KHÔNG sở hữu.'};return {ok:true,target}}
const state={establishedActivities:new Set(['tu_luyen']),recentActivity:'tu_luyen',recipes:new Set(),inventory:[],professionExp:0,expMultiplier:2};
function establishActivity(activity){state.establishedActivities.add(activity);state.recentActivity=activity}
function recordCultivation(){establishActivity('tu_luyen')}
function recordCraft(recipe){state.recipes.add(recipe);establishActivity('luyen_dan:'+recipe)}
function availableSkipActivities(){return [...state.establishedActivities]}
function canSkip(activity){return state.establishedActivities.has(activity)}
function requirePrecedent(activity){if(!canSkip(activity))throw new Error(NO_PRECEDENT)}
function addProfessionExpClamped(amount){const before=state.professionExp;const maxPerSkip=1000000;state.professionExp=Math.min(before+Math.max(0,amount),before+maxPerSkip);return state.professionExp-before}
function consumeIngredients(recipe,maxPills){const source=state.inventory.find(i=>normalizeName(bareItemName(i.name))===normalizeName(recipe));return Math.max(0,Math.min(maxPills,source?.quantity||0))}
function calcTimeSkipCultivation(years,basePerYear=110000){let total=0;for(let y=0;y<years;y++)total+=basePerYear*Math.pow(.85,y);return total*state.expMultiplier}
function calcTimeSkipCraft(recipe,years,pillExp){requirePrecedent('luyen_dan:'+recipe);const pills=consumeIngredients(recipe,Math.floor(years*10));const perPill=pillExp*Math.pow(.85,Math.max(0,years-1));return {pills,exp:pills*perPill,professionExp:addProfessionExpClamped(pills*perPill*0.25)}}
function performTimeSkip(activity,years=1){requirePrecedent(activity);if(activity==='tu_luyen')return {exp:calcTimeSkipCultivation(years)};if(activity.startsWith('luyen_dan:')){const recipe=activity.split(':').slice(1).join(':');const rankOk=recipe!=='Tẩy Tủy Đan'||state.professionRank>='Đan Đạo Đại Sư';if(!rankOk)throw new Error('❌ Chưa đạt Đan Đạo Đại Sư để luyện Tẩy Tủy Đan.');return calcTimeSkipCraft(recipe,years,recipe==='Tẩy Tủy Đan'?50000:10000)}return {exp:0}}
function loadSave(save){const s=save||{};state.establishedActivities=new Set(s.establishedActivities||['tu_luyen']);state.recentActivity=s.recentActivity||'tu_luyen';state.recipes=new Set(s.recipes||[]);state.inventory=s.inventory||[];state.professionExp=s.professionExp||0}
function snapshot(){return {version:APP_VERSION,dbVersion:DB_VERSION,establishedActivities:[...state.establishedActivities],recentActivity:state.recentActivity,recipes:[...state.recipes],inventory:state.inventory,professionExp:state.professionExp}}
window.GameAPI={APP_VERSION,extractItemCandidate,resolveGiveTarget,validateGive,mergeItemStack,recordCultivation,recordCraft,performTimeSkip,loadSave,snapshot,NO_PRECEDENT,calcTimeSkipCultivation,calcTimeSkipCraft};
</script>
</body></html>
