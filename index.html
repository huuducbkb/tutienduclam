<body>
<h1>HỒNG ĐỨC TU TIÊN LỘ v2.8.7.4</h1>
<script>
'use strict';
const RELEASE_VERSION = 'v2.8.7.4';
const REALM_LIFESPAN = { LK:120, TC:250, KD:600, NA:1200, HT:3000, LH:Infinity };
const WORLD_FRAMEWORK_PHAM_NHAN = `BỐI CẢNH: Thiên Nam Vực, khởi đầu Việt Quốc, làng Ngũ Lý Câu → Thất Huyền Môn (Thái Lĩnh Sơn) → Hoàng Phong Cốc.
ĐỊA LÝ: Việt Quốc thất đại tông: Hoàng Phong Cốc, Yểm Nguyệt Tông, Thanh Hư Môn, Thiên Khuyết Bảo, Hóa Đao Ổ, Linh Thú Sơn, Cự Kiếm Môn; Kính Châu, Gia Nguyên Thành, Thái Nam Sơn (Thái Nam Tiểu Hội), Huyết Sắc Cấm Địa; Ma Đạo Lục Tông: Quỷ Linh Môn, Hợp Hoan Tông, Ma Diễm Môn, Thiên Ma Tông, Ngự Linh Tông, Khôi Lỗi Môn; Loạn Tinh Hải, Tinh Cung, Nghịch Tinh Minh, Hư Thiên Điện, Âm Minh Chi Địa; Đại Tấn Hoàng Triều, Côn Ngô Sơn.
HỆ THỐNG SỨC MẠNH: LK 13 tầng (thọ 120) → Trúc Cơ (250) → Kim Đan (600) → Nguyên Anh (1200) → Hóa Thần (3000); linh căn quyết định tốc độ và tỷ lệ đột phá; đại đột phá cần đan dược và điều kiện, tỷ lệ giảm dần.
QUY TẮC THẾ GIỚI: kẻ mạnh nuốt kẻ yếu; giấu tu vi là sống còn; quan hệ dựa trên lợi ích và thiện cảm; tài nguyên khan hiếm; lạm dụng đan sinh kháng dược; thọ nguyên ép đột phá; đoạt xá là lối thoát cuối với giá nặng.
QUY TẮC AI: luôn có lựa chọn đào tẩu khi nguy hiểm; không buff vô lý; NPC không tử tế vô điều kiện; không tự đột phá hộ người chơi; hậu quả theo quy tắc thế giới; tôn trọng mốc pacing.
PACING: nhịp chậm chính tông; mỗi đại đột phá là chuỗi chuẩn bị đan dược, vật phẩm và bí pháp.`;
let mcAge = 16, mcPillTolerance = {}, grace = null, playMode = 'song_hanh';
function pillToleranceEff(count){ return count<=9 ? 1 : Math.max(.2,1-(count-9)*.02); }
function advanceAge(days){ mcAge += days/365; if(grace && currentHours()>grace.deadline) toilHoa(); }
function currentHours(){ return Number(document.getElementById('mcGameTime')?.dataset.hours||0); }
function toilHoa(){ document.body.innerHTML='<div style="position:fixed;inset:0;background:#090909;color:#f00;display:grid;place-items:center;font-size:32px;text-align:center">☠️ TOẠ HÓA - thọ nguyên tận<br><button onclick="loadGame()">Tải bản lưu cuối</button></div>'; }
function beginGrace(cap){ if(!grace){ grace={deadline:currentHours()+365*24}; console.log('Thọ nguyên cạn kỹ! 1 năm để đoạt xá, quá hạn toạ hoá.'); } }
function attemptSeizeBody(){ const success=Math.max(.05,Math.min(.6,.30)); if(success>=Math.random()){ mcAge=16; grace=null; return true;} return false; }
function renderAge(cap){ return `🕐 Thọ nguyên: ${mcAge.toFixed(2)} / ${cap===Infinity?'vô hạn':cap} năm`; }
function saveGame(){ return JSON.stringify({mcAge,mcPillTolerance,grace,playMode,_saveVersion:RELEASE_VERSION}); }
function loadGame(data){ if(data){mcAge=data.mcAge??16;mcPillTolerance=data.mcPillTolerance||{};grace=data.grace||null;playMode=data.playMode||'song_hanh';} }
function captureStateSnapshot(){ return {mcAge,mcPillTolerance:{...mcPillTolerance},grace:grace?{...grace}:null,playMode}; }
function restoreStateSnapshot(s){ loadGame(s); }
function buildSystemRules(){ const mode={song_hanh:'Hàn Lập là NPC thực tồn, xuất hiện tại các mốc sự kiện, tranh tài nguyên và kỳ ngộ với người chơi, tu vi tăng theo dòng thời gian.', thay_the:'Hàn Lập không tồn tại. Người chơi sở hữu Chưởng Thiên Bình [Thần khí].', the_gioi_rieng:'Không dùng địa lý/NPC Phàm Nhân; chỉ dùng hệ thống cảnh giới, thọ nguyên, linh căn, kháng dược và pacing của truyện.'}[playMode]; return WORLD_FRAMEWORK_PHAM_NHAN+'\n'+mode; }
const npcSeed=[['Mặc Đại Phu','thầy thuốc Thất Huyền Môn, mưu mô toan đoạt xá đệ tử',40],['Lệ Phi Vũ','bằng hữu thiếu thời, trọng tình nghĩa',50],['Lý Hóa Nguyên','trưởng lão Kết Đan Hoàng Phong Cốc, sư phụ danh nghĩa',50],['Trần Xảo Thiến','đồng môn thầm thương',50],['Nam Cung Uyển','trưởng lão Yểm Nguyệt Tông, duyên phân Huyết Sắc Cấm Địa',50],['Vương Thiền','thiếu chủ Quỷ Linh Môn, đối thủ truyền kiếp',20],['Yến Như Yên','thiên linh căn Yến gia',50],['Tử Linh','môn chủ Diệu Âm Môn, hồng nhan tri kỷ',50],['Ngân Nguyệt','hồn phách hồ ly trong bảo vật, trợ thủ trung thành',50],['Đại Diễn Thần Quân','tàn hồn cổ tu trong khôi lỗi, truyền đạo',50]];
function generateNpcRules(affinity){return affinity>80?'chủ động trợ giúp lúc nguy hiểm, tiết lộ tin tức và đan phương, giá ưu đãi':affinity>=50?'thiện chí, giao dịch công bằng':affinity>=0?'dè dặt đề phòng, giá cao':'từ chối giao dịch lớn, có thể phản bội, đâm sau lưng khi có lợi';}
</script>
