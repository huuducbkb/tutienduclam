<!-- TAB NPCS (NHÂN VẬT PHỤ) -->
<div id="tab-npcs" class="tab-content">
  <div class="bg-gray-800 rounded-lg p-5 shadow-lg border border-gray-700">
    <div class="flex justify-between items-center mb-4 pb-2 border-b border-gray-700">
      <h2 class="text-xl font-bold text-amber-400 flex items-center gap-2">
        <span>👥</span> DANH SÁCH NHÂN VẬT (NPCs) & QUAN HỆ
      </h2>
      <button onclick="addNewNPC()" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1.5 rounded text-sm font-semibold flex items-center gap-1 transition">
        ➕ Thêm NPC Mới
      </button>
    </div>

    <!-- Danh sách thẻ NPC -->
    <div id="npc-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- NPC mẫu 1 -->
      <div class="npc-card bg-gray-900 border border-gray-700 rounded-lg p-4 flex flex-col justify-between">
        <div>
          <div class="flex gap-4 items-start mb-3">
            <!-- Khung ảnh đại diện NPC -->
            <div class="relative group w-24 h-24 flex-shrink-0 bg-gray-800 border-2 border-amber-500/50 rounded-lg overflow-hidden flex items-center justify-center">
              <img id="npc-avatar-1" src="https://via.placeholder.com/150?text=NPC+Avatar" class="w-full h-full object-cover" alt="NPC Avatar">
              <label for="upload-npc-1" class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 flex items-center justify-center text-xs text-amber-300 font-bold cursor-pointer transition">
                📸 Đổi ảnh
              </label>
              <input type="file" id="upload-npc-1" accept="image/*" class="hidden" onchange="uploadNPCAvatar(event, 1)">
            </div>

            <!-- Thông tin cơ bản -->
            <div class="flex-grow">
              <input type="text" value="Hồng Đức (Mẫu)" class="bg-transparent text-lg font-bold text-amber-300 w-full focus:outline-none focus:border-b border-amber-500" placeholder="Tên NPC...">
              <p class="text-xs text-gray-400 mt-1">Cảnh giới / Thân phận:</p>
              <input type="text" value="Luyện Khí Tầng 3 - Sư huynh" class="bg-gray-800/60 text-xs text-gray-200 w-full p-1 rounded mt-0.5 border border-gray-700 focus:outline-none" placeholder="Thân phận...">
            </div>
          </div>

          <!-- Tính cách -->
          <div class="mb-3">
            <span class="text-xs font-semibold text-gray-400">🎭 Tính cách:</span>
            <textarea class="w-full bg-gray-800 text-xs text-gray-300 p-2 rounded mt-1 border border-gray-700 focus:outline-none resize-none" rows="2" placeholder="Mô tả tính cách NPC...">Trầm lặng, cẩn trọng, trọng tình nghĩa nhưng luôn giấu kín tâm tư.</textarea>
          </div>

          <!-- Mối quan hệ & Thang điểm Hảo cảm (0 - 100) -->
          <div class="space-y-1.5 bg-gray-800/40 p-2.5 rounded-lg border border-gray-700/50">
            <div class="flex justify-between items-center text-xs">
              <span class="font-semibold text-gray-300">❤️ Điểm Hảo Cảm:</span>
              <span id="affinity-text-1" class="font-bold text-amber-400">60 / 100 (Thân Thiết)</span>
            </div>
            
            <!-- Thanh Tiến Độ Hảo Cảm -->
            <div class="w-full bg-gray-700 h-3 rounded-full overflow-hidden p-0.5">
              <div id="affinity-bar-1" class="bg-amber-500 h-full rounded-full transition-all duration-300" style="width: 60%;"></div>
            </div>

            <!-- Nút điều chỉnh hảo cảm nhanh -->
            <div class="flex justify-between items-center pt-1">
              <div class="flex gap-1">
                <button onclick="updateAffinity(1, -5)" class="bg-red-900/60 hover:bg-red-800 text-red-200 text-[10px] px-2 py-0.5 rounded border border-red-700">-5</button>
                <button onclick="updateAffinity(1, -1)" class="bg-red-900/40 hover:bg-red-800 text-red-300 text-[10px] px-2 py-0.5 rounded border border-red-700/50">-1</button>
              </div>
              <span class="text-[10px] text-gray-400 italic">Mối quan hệ: Bằng hữu</span>
              <div class="flex gap-1">
                <button onclick="updateAffinity(1, 1)" class="bg-emerald-900/40 hover:bg-emerald-800 text-emerald-300 text-[10px] px-2 py-0.5 rounded border border-emerald-700/50">+1</button>
                <button onclick="updateAffinity(1, 5)" class="bg-emerald-900/60 hover:bg-emerald-800 text-emerald-200 text-[10px] px-2 py-0.5 rounded border border-emerald-700">+5</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- SCRIPT XỬ LÝ HẢO CẢM & TẢI ẢNH NPC -->
<script>
  // Hàm xử lý tăng/giảm điểm Hảo cảm (0 - 100)
  function updateAffinity(npcId, change) {
    const bar = document.getElementById(`affinity-bar-${npcId}`);
    const text = document.getElementById(`affinity-text-${npcId}`);
    if (!bar || !text) return;

    let currentVal = parseInt(bar.style.width) || 0;
    let newVal = Math.min(100, Math.max(0, currentVal + change));

    bar.style.width = newVal + '%';

    // Đánh giá trạng thái mối quan hệ theo thang điểm 100
    let status = '';
    let colorClass = '';

    if (newVal <= 20) {
      status = 'Thù Địch';
      colorClass = 'bg-red-600';
      text.className = 'font-bold text-red-400';
    } else if (newVal <= 40) {
      status = 'Lạnh Nhạt';
      colorClass = 'bg-orange-500';
      text.className = 'font-bold text-orange-400';
    } else if (newVal <= 60) {
      status = 'Thân Thiết';
      colorClass = 'bg-amber-500';
      text.className = 'font-bold text-amber-400';
    } else if (newVal <= 80) {
      status = 'Tin Tưởng';
      colorClass = 'bg-emerald-500';
      text.className = 'font-bold text-emerald-400';
    } else {
      status = 'Tri Kỷ / Tử Sinh';
      colorClass = 'bg-cyan-400';
      text.className = 'font-bold text-cyan-300';
    }

    bar.className = `h-full rounded-full transition-all duration-300 ${colorClass}`;
    text.innerText = `${newVal} / 100 (${status})`;
  }

  // Hàm upload & resize ảnh đại diện cho NPC
  function uploadNPCAvatar(event, npcId) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 150;
        canvas.height = 150;

        // Vẽ resize vuông 150x150
        ctx.drawImage(img, 0, 0, 150, 150);
        const resizedDataUrl = canvas.toDataURL('image/jpeg', 0.8);

        // Hiển thị lên giao diện
        document.getElementById(`npc-avatar-${npcId}`).src = resizedDataUrl;
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
</script>
