<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hồng Đức Tu Tiên Lộ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-paper: #e6dac3;
            --text-dark: #2c1e16;
            --text-light: #5a4535;
            --border-color: #4a3424;
            --accent-red: #8b1c1c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #1a1512;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Noto Serif', serif;
            overflow: hidden;
        }

        .app-wrapper {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 900px;
            background-color: var(--bg-paper);
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ================= MÀN HÌNH KHAI MỞ ================= */
        #splash-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #fffaf0;
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease;
        }

        .splash-title {
            font-family: 'Noto Serif', serif;
            font-weight: bold;
            font-size: 32px;
            letter-spacing: 2px;
            color: #111;
            text-align: center;
        }

        .splash-subtitle {
            font-size: 16px;
            color: #333;
            align-self: flex-start;
            margin-left: 40px;
            margin-bottom: 80px;
        }

        .start-btn {
            position: relative;
            cursor: pointer;
            text-align: center;
            animation: pulse 2s infinite;
        }
        
        .start-label {
            background: #e6f0fa;
            color: #1a73e8;
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        .start-text {
            font-size: 15px;
            color: #222;
            margin-top: 15px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* ================= GIAO DIỆN CHÍNH ================= */
        #main-game {
            display: none;
            flex-direction: column;
            height: 100%;
            background-image: linear-gradient(rgba(230, 218, 195, 0.95), rgba(230, 218, 195, 0.95)), 
                              repeating-linear-gradient(45deg, rgba(0,0,0,0.02) 0, rgba(0,0,0,0.02) 2px, transparent 2px, transparent 4px);
        }

        /* Header */
        .header {
            text-align: center;
            padding: 10px;
            border-bottom: 1px solid rgba(74, 52, 36, 0.2);
        }

        .header h1 {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 32px;
            color: var(--text-dark);
            line-height: 1;
        }
        
        .header h2 {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 22px;
            color: var(--accent-red);
            margin-top: -5px;
        }

        /* Thanh trạng thái */
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 6px 10px;
            background: rgba(0,0,0,0.06);
            border-bottom: 2px solid rgba(74, 52, 36, 0.4);
            font-size: 10px;
            font-weight: bold;
            color: var(--text-light);
        }
        .status-item span { color: var(--text-dark); }

        /* Nội dung chính */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 15px; /* Tăng khoảng cách một chút vì giờ chỉ còn 2 khối */
        }
        
        .main-content::-webkit-scrollbar { width: 4px; }
        .main-content::-webkit-scrollbar-thumb { background: rgba(74, 52, 36, 0.5); border-radius: 4px; }

        /* Khối Card */
        .card {
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(74, 52, 36, 0.3);
            border-radius: 6px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05), inset 0 0 10px rgba(255,255,255,0.4);
            /* Cho phép card co giãn lấp đầy khoảng trống */
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 22px;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 5px;
        }

        /* Cốt truyện - To và rộng nhất */
        .story-text {
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-dark);
            font-style: italic;
            /* Chiều cao tối thiểu lớn để chiếm chỗ */
            min-height: 250px; 
            white-space: pre-wrap;
            flex: 1; /* Tự động giãn nở */
        }
        
        .typing-cursor::after {
            content: '|';
            animation: blink 1s infinite;
            color: var(--accent-red);
            font-weight: bold;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Tin tức / Sự kiện */
        .news-item {
            font-size: 13px;
            margin-bottom: 8px;
            color: var(--text-dark);
            line-height: 1.5;
        }
        .news-item::before { content: '•'; color: var(--accent-red); margin-right: 6px; font-weight: bold;}

        .btn-more {
            display: inline-block;
            background: var(--text-dark);
            color: var(--bg-paper);
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 12px;
            cursor: pointer;
        }
        .text-right { text-align: right; margin-top: 5px; }

        /* Footer Navigation */
        .footer {
            display: flex;
            justify-content: space-around;
            padding: 8px 5px;
            background: rgba(0,0,0,0.1);
            border-top: 2px solid var(--border-color);
        }
        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-dark);
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
        }
        .nav-btn .icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1.5px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            background: rgba(255,255,255,0.2);
        }
        .nav-btn.active .icon { background: var(--text-dark); color: var(--bg-paper); }
    </style>
</head>
<body>

    <div class="app-wrapper">
        
        <!-- MÀN HÌNH KHAI MỞ -->
        <div id="splash-screen">
            <div class="splash-title">HỒNG ĐỨC TU TIÊN LỘ</div>
            <div class="splash-subtitle">V1</div>
            
            <div class="start-btn" onclick="startGame()">
                <div class="start-label">KHAI MỞ</div>
                <svg width="70" height="50" viewBox="0 0 100 80">
                    <path d="M 10 70 L 50 30 L 90 70" fill="none" stroke="#4a3424" stroke-width="6" stroke-linecap="round"/>
                    <path d="M 30 70 L 50 50 L 70 70" fill="none" stroke="#4a3424" stroke-width="6" stroke-linecap="round"/>
                </svg>
                <div class="start-text">Nhấn để bước vào con đường tu tiên</div>
            </div>
        </div>

        <!-- GIAO DIỆN CHÍNH -->
        <div id="main-game">
            <!-- HEADER -->
            <div class="header">
                <h1>HỒNG ĐỨC</h1>
                <h2>Tu Tiên Lộ V1</h2>
            </div>

            <!-- STATUS BAR -->
            <div class="status-bar">
                <div class="status-item">👤 Hồng Đức</div>
                <div class="status-item">☯ Trúc Cơ Tầng 3</div>
                <div class="status-item">🍃 <span id="linh-thach">12.345</span></div>
                <div class="status-item">⏳ 1.248 Năm</div>
                <div class="status-item">📜 Chương 23</div>
            </div>

            <!-- MAIN CONTENT -->
            <div class="main-content">
                
                <!-- CỐT TRUYỆN (Chiếm phần lớn diện tích) -->
                <div class="card" style="flex: 2;"> <!-- flex: 2 để khối này to hơn khối dưới -->
                    <div class="card-title">☁️ Cốt Truyện</div>
                    <div class="story-text" id="story-container"></div>
                </div>

                <!-- TIN TỨC / SỰ KIỆN -->
                <div class="card" style="flex: 1;">
                    <div class="card-title">🕊️ Tin Tức / Sự Kiện</div>
                    <div id="event-container"></div>
                    <div class="text-right"><span class="btn-more">Xem thêm ></span></div>
                </div>

            </div>

            <!-- FOOTER -->
            <div class="footer">
                <div class="nav-btn"><div class="icon">🧙</div>Nhân Vật</div>
                <div class="nav-btn"><div class="icon">🎒</div>Túi Đồ</div>
                <div class="nav-btn active"><div class="icon">☯</div>Tu Luyện</div>
                <div class="nav-btn"><div class="icon">🏯</div>Tông Môn</div>
                <div class="nav-btn"><div class="icon">🌍</div>Thế Giới</div>
            </div>
        </div>

    </div>

    <script>
        // LOGIC CHUYỂN MÀN HÌNH
        function startGame() {
            const splash = document.getElementById('splash-screen');
            const mainGame = document.getElementById('main-game');
            
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
                mainGame.style.display = 'flex';
                initGameStory(); 
            }, 800); 
        }

        // LOGIC KỂ CHUYỆN
        function typeWriter(elementId, text, speed = 35) {
            const element = document.getElementById(elementId);
            element.innerHTML = '';
            element.classList.add('typing-cursor');
            let i = 0;
            
            function type() {
                if (i < text.length) {
                    if (text.charAt(i) === '\n') {
                        element.innerHTML += '<br>';
                    } else {
                        element.innerHTML += text.charAt(i);
                    }
                    i++;
                    setTimeout(type, speed);
                } else {
                    element.classList.remove('typing-cursor');
                }
            }
            type();
        }

        function updateStory(newStoryText) {
            typeWriter('story-container', newStoryText, 30);
        }

        function updateEvents(eventsArray) {
            const container = document.getElementById('event-container');
            container.innerHTML = '';
            eventsArray.forEach(event => {
                const div = document.createElement('div');
                div.className = 'news-item';
                div.innerText = event;
                container.appendChild(div);
            });
        }

        function updateLinhThach(amount) {
            document.getElementById('linh-thach').innerText = amount;
        }

        // KỊCH BẢN CHẠY THỬ
        function initGameStory() {
            const openingStory = "Thiên địa sơ khai, vạn linh thức tỉnh.\nTrên con đường tu tiên, ta ma hoành hành, bí cảnh vô số, cường giả như mây.\nNgươi từ một phàm nhân nhỏ bé, từng bước nghịch thiên cải mệnh, truy tìm đại đạo, chứng đạo trường sinh.\n\nHôm nay, ngươi đang ngồi thiền trong động phủ, bỗng nhiên linh khí xung quanh dao động kịch liệt...";
            updateStory(openingStory);

            const currentEvents = [
                "Chúc mừng đạo hữu Vô Danh Đại Đế đột phá thành công, phi thăng Tiên Giới!",
                "Bí Cảnh Huyễn Vực đã làm mới, nhiều bảo vật chưa được khám phá!",
                "Sự kiện Tích Nạp nhận thưởng đang diễn ra, đừng bỏ lỡ!"
            ];
            updateEvents(currentEvents);
        }
    </script>
</body>
</html>
