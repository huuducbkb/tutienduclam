<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hồng Đức Tu Tiên Lộ</title>
    <!-- Nhúng Font thư pháp và Font chữ cổ -->
    <link href="https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&family=Noto+Serif:ital,wght@1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/splash.css">
</head>
<body>

    <!-- Màn hình chờ -->
    <div id="splash-screen">
        
        <!-- Bìa sách bên trái -->
        <div class="book-cover">
            <!-- Các sợi dây buộc gáy sách -->
            <div class="binding-string string-1"></div>
            <div class="binding-string string-2"></div>
            <div class="binding-string string-3"></div>
            <div class="binding-string string-4"></div>

            <!-- Khung viền góc -->
            <div class="corner-frame top-left"></div>
            <div class="corner-frame bottom-right"></div>

            <!-- Nội dung bìa -->
            <div class="cover-content">
                <div class="ink-mountain">
                    <!-- Có thể chèn ảnh núi non SVG vào đây sau -->
                    <svg viewBox="0 0 100 50" class="mountain-svg">
                        <path d="M10,50 Q30,20 50,50 M30,50 Q60,10 90,50" fill="none" stroke="#4a3b32" stroke-width="1.5"/>
                    </svg>
                </div>
                
                <h1 class="book-title">
                    <span>HỒNG</span>
                    <span>ĐỨC</span>
                    <span>TU</span>
                    <span>TIÊN</span>
                    <span>LỘ</span>
                </h1>

                <div class="version-stamp">
                    <span>V1</span>
                </div>

                <div class="ink-pavilion">
                     <svg viewBox="0 0 100 50" class="pavilion-svg">
                        <path d="M20,50 L50,30 L80,50 M35,50 L50,40 L65,50" fill="none" stroke="#4a3b32" stroke-width="1"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Khung nút Bắt Đầu -->
        <div class="start-action">
            <button class="btn-start" onclick="startGame()">
                <span class="btn-text">KHAI MỞ</span>
                <div class="seal-border"></div>
            </button>
            <p class="hint-text">Nhấn để bước vào con đường tu tiên</p>
        </div>

    </div>

    <!-- Phần Game chính (Sẽ hiện sau khi bấm Start) -->
    <div id="main-game" style="display: none;">
        <!-- Game UI goes here -->
        <h1 style="color: white; text-align: center; margin-top: 50px;">Game Đã Bắt Đầu!</h1>
    </div>

    <script>
        function startGame() {
            // Hiệu ứng mờ dần màn hình chờ
            const splash = document.getElementById('splash-screen');
            const mainGame = document.getElementById('main-game');
            
            splash.style.opacity = '0';
            splash.style.transition = 'opacity 1s ease';
            
            setTimeout(() => {
                splash.style.display = 'none';
                mainGame.style.display = 'block';
                // Gọi hàm khởi tạo game thật ở đây
                // initGame(); 
            }, 1000);
        }
    </script>
</body>
</html>
