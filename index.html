<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX ELITE - AI RPG</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --panel-bg: #151921;
            --input-bg: #0d1117;
            --accent-purple: #8957e5;
            --accent-blue: #388bfd;
            --text-color: #c9d1d9;
            --border-color: #30363d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); font-size: 13px; line-height: 1.4; padding: 8px; }

        /* Header Bar */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 8px; background: var(--panel-bg); border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--border-color); }
        .header-title { font-size: 16px; font-weight: bold; color: var(--accent-blue); display: flex; align-items: center; gap: 6px; }
        .menu-btn, .play-btn { background: #21262d; border: 1px solid var(--border-color); color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .play-btn { background: #238636; }

        /* Slide-out Sidebar */
        .sidebar { position: fixed; top: 0; left: -280px; width: 260px; height: 100%; background: var(--panel-bg); border-right: 1px solid var(--border-color); transition: 0.3s; z-index: 100; padding: 12px; }
        .sidebar.active { left: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 16px; font-weight: bold; }
        .sidebar-item { display: block; width: 100%; padding: 10px; background: #21262d; border: 1px solid var(--border-color); color: #fff; text-align: left; border-radius: 6px; margin-bottom: 8px; font-weight: bold; }

        /* Tabs Navigation */
        .tabs { display: flex; gap: 4px; overflow-x: auto; margin-bottom: 10px; background: var(--panel-bg); padding: 4px; border-radius: 8px; }
        .tab-btn { flex: 1; padding: 8px; border: none; background: transparent; color: #8b949e; font-weight: bold; border-radius: 6px; white-space: nowrap; font-size: 12px; }
        .tab-btn.active { background: var(--input-bg); color: var(--accent-blue); border: 1px solid var(--border-color); }

        /* Tab Content */
        .tab-content { display: none; background: var(--panel-bg); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 12px; }
        .tab-content.active { display: block; }

        /* Form Controls */
        .form-group { margin-bottom: 12px; }
        label { display: block; color: #8b949e; margin-bottom: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        input, textarea, select { width: 100%; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 6px; color: #fff; padding: 8px; font-size: 13px; font-family: inherit; }
        textarea { resize: vertical; min-height: 60px; }

        /* AI Gen Button Frame */
        .input-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .btn-aigen { background: var(--accent-purple); color: #fff; border: none; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; }

        /* Play Box & Logs */
        #story-box { background: var(--input-bg); height: 350px; overflow-y: auto; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); white-space: pre-wrap; margin-bottom: 10px; }
        .log-box { background: #000; color: #7cb342; font-family: monospace; font-size: 10px; padding: 8px; border-radius: 6px; height: 80px; overflow-y: auto; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="header-title">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <span>MATRIX ELITE</span>
        </div>
        <button class="play-btn" onclick="openTab('play')">▶ PLAY</button>
    </div>

    <!-- Sidebar Menu Slide-out -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <span>⚙ MATRIX ELITE</span>
            <button class="menu-btn" onclick="toggleSidebar()">✕</button>
        </div>
        <button class="sidebar-item" onclick="openTab('cfg'); toggleSidebar();">⚙ Cấu Hình API Key</button>
        <button class="sidebar-item" onclick="alert('Tính năng Lưu Trữ đang dùng bộ nhớ LocalStorage'); toggleSidebar();">📁 Lưu Trữ / Tiếp Tục</button>
        <hr style="border-color: var(--border-color); margin: 10px 0;">
        <div class="form-group">
            <label>API Key Gemini:</label>
            <input type="password" id="apiKey" placeholder="Dán Gemini API Key...">
        </div>
    </div>

    <!-- Tabs Menu -->
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('world')">🌐 World</button>
        <button class="tab-btn" onclick="openTab('mc')">👤 MC</button>
        <button class="tab-btn" onclick="openTab('npc')">👥 NPCs</button>
        <button class="tab-btn" onclick="openTab('loc')">📍 Location</button>
        <button class="tab-btn" onclick="openTab('play')">🎮 Game</button>
    </div>

    <!-- TAB 1: WORLD -->
    <div id="world" class="tab-content active">
        <div class="form-group">
            <div class="input-header">
                <label>Ý TƯỞNG SƠ KHAI</label>
                <button class="btn-aigen" onclick="aiGenField('worldIdea', 'Gợi ý 3 ý tưởng bối cảnh tu tiên / huyền huyễn độc đáo')">✨ AI GEN</button>
            </div>
            <textarea id="worldIdea" placeholder="VD: Thế giới phàm nhân tu tiên, linh khí suy kiệt..."></textarea>
        </div>

        <div class="form-group">
            <label>THIẾT LẬP ĐỘ KHÓ & CHẾ ĐỘ</label>
            <select id="difficulty">
                <option value="SFW - An toàn, tập trung chiến đấu tu luyện">SFW (An toàn / Thường)</option>
                <option value="NSFW - Nhạy cảm, tập trung tình cảm / sắc hiệp">NSFW (Tự do / Người lớn)</option>
            </select>
        </div>

        <div class="form-group">
            <label>QUY TẮC THẾ GIỚI & HỆ THỐNG CẢNH GIỚI</label>
            <textarea id="worldRules" placeholder="VD: Luyện Khí -> Trúc Cơ -> Kim Đan. Quy tắc đoạt xá..."></textarea>
        </div>

        <div class="form-group">
            <label>CÁC QUỐC GIA & THẾ LỰC</label>
            <textarea id="factions" placeholder="VD: Trực Tiên Sơn, Quỷ Vương Tông..."></textarea>
        </div>
    </div>

    <!-- TAB 2: MC -->
    <div id="mc" class="tab-content">
        <div class="form-group">
            <label>TÊN & THÂN PHẬN NHÂN VẬT CHÍNH</label>
            <input type="text" id="mcName" placeholder="VD: Lâm Thần - 16 tuổi - Đệ tử ngoại môn">
        </div>
        <div class="form-group">
            <label>KỸ NĂNG & NĂNG LỰC CỐT LÕI</label>
            <textarea id="mcSkills" placeholder="VD: Tạp linh căn, ngộ tính cao..."></textarea>
        </div>
        <div class="form-group">
            <label>🎒 TÚI ĐỒ (INVENTORY)</label>
            <textarea id="mcInventory" placeholder="VD: 10 Linh thạch hạ phẩm, 1 Dược đao..."></textarea>
        </div>
    </div>

    <!-- TAB 3: NPCS -->
    <div id="npc" class="tab-content">
        <div class="form-group">
            <div class="input-header">
                <label>DANH SÁCH NPC & TÍNH CÁCH</label>
                <button class="btn-aigen" onclick="aiGenField('npcList', 'Tạo 2 NPC gồm tên, cảnh giới, ngoại hình và thái độ với MC')">✨ AI GEN</button>
            </div>
            <textarea id="npcList" rows="6" placeholder="VD:
- Hồng Đức: Trưởng lão (Địch ý, nghi ngờ MC)
- Ân Nghiên: Sư tỷ Trúc Cơ (Trung lập, lạnh lùng)"></textarea>
        </div>
    </div>

    <!-- TAB 4: LOCATION -->
    <div id="loc" class="tab-content">
        <div class="form-group">
            <label>ĐỊA ĐIỂM & BẢN ĐỒ KHAI PHÁ</label>
            <textarea id="locations" rows="6" placeholder="VD: 
- Thị Trấn Bát Quái: Nơi giao dịch hỗn loạn.
- Dược Vương Cốc: Nơi hái linh thảo nguy hiểm."></textarea>
        </div>
    </div>

    <!-- TAB 5: PLAY & LOGS -->
    <div id="play" class="tab-content">
        <div id="story-box">Chưa có dữ liệu. Hãy thiết lập các Tab và bấm "KHỞI TẠO GAME" ở dưới!</div>
        <button class="sidebar-item" style="background:#238636; text-align:center;" onclick="startGame()">⚡ KHỞI TẠO GAME MỚI</button>
        
        <div class="form-group" style="margin-top: 10px;">
            <input type="text" id="userInput" placeholder="Nhập lựa chọn (1,2,3...) hoặc hành động tự do...">
            <button class="sidebar-item" style="background:var(--accent-purple); text-align:center; margin-top:5px;" onclick="sendAction()">GỬI HÀNH ĐỘNG ➔</button>
        </div>

        <label>SYSTEM LOGS (NHẬT KÝ HỆ THỐNG)</label>
        <div id="sysLogs" class="log-box">> System initialized... Ready.</div>
    </div>

    <script>
        let chatHistory = [];

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        function openTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            
            // Highlight active tab button
            const btn = Array.from(document.querySelectorAll('.tab-btn')).find(b => b.getAttribute('onclick').includes(tabId));
            if(btn) btn.classList.add('active');
        }

        function log(msg) {
            const logBox = document.getElementById('sysLogs');
            logBox.innerHTML += `<br>> ${msg}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function callGemini(promptText) {
            const key = document.getElementById('apiKey').value.trim();
            if(!key) { 
                alert("Vui lòng nhập API Key trong Menu ☰ !"); 
                toggleSidebar(); 
                return null; 
            }

            log("Calling Gemini API...");
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;
            chatHistory.push({ role: "user", parts: [{ text: promptText }] });

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: chatHistory })
                });
                const data = await response.json();
                if(data.error) throw new Error(data.error.message);
                
                const aiReply = data.candidates[0].content.parts[0].text;
                chatHistory.push({ role: "model", parts: [{ text: aiReply }] });
                log("Response received successfully.");
                return aiReply;
            } catch(e) {
                log("ERROR: " + e.message);
                alert("Lỗi gọi AI: " + e.message);
                return null;
            }
        }

        async function aiGenField(fieldId, promptMsg) {
            const field = document.getElementById(fieldId);
            log("AI Gen requested for: " + fieldId);
            field.value = "AI đang suy nghĩ và viết...";
            const res = await callGemini(`Hãy đóng vai Game Master, hãy tạo nội dung chi tiết cho mục sau: ${promptMsg}. Chỉ trả về nội dung text ngắn gọn, đúng trọng tâm.`);
            if(res) field.value = res;
        }

        async function startGame() {
            const storyBox = document.getElementById('story-box');
            chatHistory = [];
            storyBox.innerText = "🔄 Đang khởi tạo thế giới từ dữ liệu các Tab...";
            log("Starting new game session...");

            const systemPrompt = `Bạn là Game Master chuyên nghiệp cho Game Roleplay Text MATRIX ELITE.
[BỐI CẢNH THẾ GIỚI]: ${document.getElementById('worldIdea').value}
[ĐỘ KHÓ/CHẾ ĐỘ]: ${document.getElementById('difficulty').value}
[QUY TẮC & CẢNH GIỚI]: ${document.getElementById('worldRules').value}
[THẾ LỰC]: ${document.getElementById('factions').value}

[NHÂN VẬT CHÍNH (MC)]: ${document.getElementById('mcName').value}
[KỸ NĂNG MC]: ${document.getElementById('mcSkills').value}
[TÚI ĐỒ (INVENTORY)]: ${document.getElementById('mcInventory').value}

[NPCS]: ${document.getElementById('npcList').value}
[ĐỊA ĐIỂM]: ${document.getElementById('locations').value}

Nhiệm vụ: Mở đầu chương 1 dẫn dắt câu chuyện thật cuốn hút dựa đúng vào các dữ liệu trên. Cuối bài luôn đưa ra 3-4 lựa chọn hành động có đánh số (1, 2, 3, 4) và 1 tùy chọn tự do.`;

            const reply = await callGemini(systemPrompt);
            if(reply) storyBox.innerText = reply;
        }

        async function sendAction() {
            const input = document.getElementById('userInput');
            const storyBox = document.getElementById('story-box');
            const action = input.value.trim();
            if(!action) return;

            storyBox.innerText += `\n\n[HÀNH ĐỘNG CỦA BẠN]: ${action}\n\n[AI ĐANG XỬ LÝ...]`;
            input.value = '';
            log("Player executed action: " + action);

            const reply = await callGemini(`Người chơi thực hiện: "${action}". Hãy tiếp tục diễn biến câu chuyện, cập nhật biến cố (nếu có) và đưa ra các lựa chọn tiếp theo.`);
            if(reply) {
                storyBox.innerText = storyBox.innerText.replace('[AI ĐANG XỬ LÝ...]', '') + reply;
                storyBox.scrollTop = storyBox.scrollHeight;
            }
        }
    </script>
</body>
</html>
